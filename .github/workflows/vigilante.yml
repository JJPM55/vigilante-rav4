name: Vigilante RAV4

on:
  schedule:
    - cron: "17 */2 * * *"   # cada 2 horas (hora UTC)
  workflow_dispatch:
    inputs:
      prueba:
        description: "Modo prueba (no envía email ni guarda memoria)"
        type: boolean
        default: false
      enchufables:
        description: "PRUEBA con RAV4 enchufables (usa urls_prueba.txt)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar navegador
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar vigilante
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python vigilante.py ${{ inputs.prueba && '--prueba' || '' }} ${{ inputs.enchufables && '--enchufables' || '' }}

      - name: Guardar memoria
        if: ${{ !inputs.prueba }}
        run: |
          git config user.name "vigilante-bot"
          git config user.email "vigilante-bot@users.noreply.github.com"
          git add --all -- 'seen*.json' || true
          git diff --staged --quiet || (git commit -m "Actualiza memoria" && git push)

      - name: Subir archivos de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 3
          if-no-files-found: ignore
